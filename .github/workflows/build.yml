name: Build

on:
  push:
  pull_request:
  # Actions > Build > Run workflow: builds from the chosen branch, then tags it and publishes
  # the release. GitHub doesn't run workflows for tags this workflow creates, so it does both.
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, like 1.2.3 (tagged as v1.2.3)
        required: true

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    env:
      VERSION: 0.0.0-dev
    steps:
      - uses: actions/checkout@v4
      # Releasing (a pushed tag like v1.2.3, or a manual run): build as version 1.2.3 so the
      # binaries match the release.
      - name: Set release version
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            version="${INPUT_VERSION#v}"
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
              echo "::error::Tag v$version already exists."
              exit 1
            fi
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version '$version' should look like 1.2.3."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"
          sed -i '' "s/\"0.0.0-dev\"/\"$version\"/" Sources/ImageDiffCore/AppVersion.swift
      - run: swift --version
      - run: swift test
      # Universal binaries: Apple Silicon and Intel.
      - run: scripts/build-app.sh "$VERSION"
      - name: Check binaries
        run: |
          for bin in dist/ImageDiff.app/Contents/MacOS/ImageDiff dist/ImageDiff.app/Contents/MacOS/imgdiff dist/imgdiff; do
            lipo -info "$bin"
            lipo "$bin" -verify_arch arm64 x86_64
            vtool -show-build "$bin" | grep -E 'minos'
          done
          plutil -lint dist/ImageDiff.app/Contents/Info.plist
          codesign --verify --verbose dist/ImageDiff.app
      - name: Smoke test
        run: |
          python3 scripts/make-test-images.py "$RUNNER_TEMP/img"
          cd "$RUNNER_TEMP/img"
          "$GITHUB_WORKSPACE/dist/imgdiff" --help
          "$GITHUB_WORKSPACE/dist/imgdiff" a.png a.png
          set +e
          "$GITHUB_WORKSPACE/dist/imgdiff" a.png b.png -o cli-diff.png | tee cli.txt
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 1
          grep -q "^50 of 3,072 pixels differ" cli.txt
          test -s cli-diff.png

          # The app should open, compare and save the difference image from its command line.
          "$GITHUB_WORKSPACE/dist/ImageDiff.app/Contents/MacOS/ImageDiff" a.png b.png -o "$PWD/app-diff.png" &
          app=$!
          for i in $(seq 1 60); do
            [ -s app-diff.png ] && break
            sleep 1
          done
          kill "$app" || true
          test -s app-diff.png
          cmp cli-diff.png app-diff.png
      - uses: actions/upload-artifact@v4
        with:
          name: ImageDiff-macos-universal
          path: dist

      # Publishes a GitHub release with the zipped build. On a manual run this also creates the
      # tag, on the commit that was built.
      - name: Create release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="ImageDiff-${TAG}-macos-universal.zip"
          (cd dist && ditto -c -k --keepParent ImageDiff.app "../$zip" && zip -j "../$zip" imgdiff)
          gh release create "$TAG" "$zip" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
